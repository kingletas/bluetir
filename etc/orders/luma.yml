# What to buy, and who is buying it. All invented data.
#
# The Luma sample data ships these products. Point `url` at anything the store sells.
# Luma renders size and colour as swatches rather than drop-downs, so each option clicks one.

products:
  - url: "breathe-easy-tank.html"
    qty: 1
    options:
      - { type: div, css: ".swatch-attribute.size .swatch-option[data-option-label='M']" }
      - { type: div, css: ".swatch-attribute.color .swatch-option[data-option-label='Purple']" }

  - url: "didi-sport-watch.html"
    qty: 2

customer:
  email: "bluetir@example.test"
  address:
    firstname: "Test"
    lastname: "Order"
    company: "Bluetir"
    street: "1 Test Street"
    city: "Austin"
    region: "Texas"
    postcode: "78701"
    country: "United States"
    telephone: "5125550100"
